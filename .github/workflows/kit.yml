name: kit

# The kit checks itself: frontmatter, voice, references, and the guard tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the kit
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/check_kit.py
